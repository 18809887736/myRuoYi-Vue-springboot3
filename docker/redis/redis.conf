bind 0.0.0.0
protected-mode yes
port 6379
dir /data

# 持久化: RDB + AOF
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# 内存上限(小内存机器), 超限后 LRU 淘汰
maxmemory 256mb
maxmemory-policy allkeys-lru

loglevel notice
logfile ""
databases 16
timeout 0
tcp-keepalive 300

# 密码由 docker-compose.yml 命令行 --requirepass 注入(来自 .env), 不落在此文件
